name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  # The gate the main ruleset requires. There is nothing to build yet, so it
  # passes on its own. As real jobs land, list them under `needs` and keep
  # `if: always()`, so it fails when any of them fails or is skipped.
  required:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check needed jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A needed job finished with: $result"
              exit 1
            fi
          done
